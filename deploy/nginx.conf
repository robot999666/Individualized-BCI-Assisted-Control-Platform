limit_req_zone $binary_remote_addr zone=bci_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bci_login:10m rate=5r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/als-bci/current/frontend/out;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location ~ /\. { deny all; }
    location ~* \.(pem|key|env|py|pkl|sqlite|sql)$ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /api/v1/auth/login {
        limit_req zone=bci_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=bci_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ =404; }
}
