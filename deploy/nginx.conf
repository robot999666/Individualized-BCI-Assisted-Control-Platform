map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=bci_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bci_login:10m rate=5r/m;

# Shared HTTP ingress: only the ALS IP virtual host is handled here. Port 80
# remains available for other projects and for ACME HTTP-01 certificate renewal.
server {
    listen 80;
    listen [::]:80;
    server_name 152.136.191.171;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://152.136.191.171:9443$request_uri; }
}

# The application owns only its dedicated TLS port; shared 443 is untouched.
server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name 152.136.191.171;
    root /opt/als-bci/current/frontend/out;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/152.136.191.171/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/152.136.191.171/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ALS_BCI_TLS:10m;
    ssl_session_timeout 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    location ~ /\. { deny all; }
    location ~* \.(pem|key|env|py|pkl|sqlite|sql)$ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /api/v1/auth/login {
        limit_req zone=bci_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        limit_req zone=bci_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ =404; }
}
